}
const TAKEAWAY=["{考|かんが}えていたのではなく、{玉|たま}を{引|ひ}いていただけ。","{同|おな}じことを{聞|き}いても、{毎回|まいかい}{同|おな}じ{答|こた}えとはかぎらない。","{合|あ}っているかは、{自分|じぶん}でたしかめよう。","{教|おし}えると{箱|はこ}の{中身|なかみ}が{入|い}れかわる。{前|まえ}に{教|おし}えたことは{残|のこ}らない。"];
const FINAL="{文章|ぶんしょう}を{書|か}くAIも、たくさんの{文|ぶん}から、ありそうな{続|つづ}きを{確率|かくりつ}で{選|えら}んでいる。いちばんらしい{答|こた}えは、いちばん{正|ただ}しい？";
function fail(){
  document.getElementById("main").innerHTML='<div class="panel err">けっかを<ruby>読<rt>よ</rt></ruby>みこめませんでした。<br>QRコードを、もう<ruby>一度<rt>いちど</rt></ruby><ruby>読<rt>よ</rt></ruby>みこんでみてね。</div>';
}
function render(){
  let p; try{ p=decode(location.hash); }catch(e){ p=null; }
  if(!p||typeof p!=="object"||p.v!==1||p.h!==DATA_FP||!DATA[p.s]) return fail();
  const d=DATA[p.s], keys=Object.keys(d.colors), A=i=>(Number.isInteger(i)&&i>=0&&i<keys.length)?keys[i]:null;
  const card=d.cards[p.g]; if(!card) return fail();
  const choice=A(p.c), before=A(p.b), after=A(p.a);
  if(choice===null||after===null) return fail();
  const flipped=(Array.isArray(p.f)?p.f:[]).filter(i=>d.cards[i]&&i!==p.g);
  const dots=(list)=>{ const m={}; list.forEach(([a,n])=>m[a]=n); return m; };
  const B=dots(d.base), K=dots(card.balls);
  const used=keys.filter(a=>B[a]||K[a]);
  const jar=(title,m,now)=>`<div class="jar${now?" now":""}"><h3>${title}</h3>`+used.map(a=>{
      const n=m[a]||0;
      const tags=(a===choice?'<span class="mk">あなた</span>':'')+(now&&a===after?'<span class="mk m">マシン</span>':'')+(!now&&before!==null&&a===before?'<span class="mk m">マシン</span>':'');
      return `<div class="row"><div class="nm">${erb(a)}${tags}</div><div class="dots">${n?Array.from({length:n},()=>`<i style="background:${d.colors[a]}"></i>`).join(""):'<em class="zero">（なし）</em>'}</div></div>`;
    }).join("")+`</div>`;
  const same=after===choice;
  let h="";
  h+=`<div class="panel"><div class="label"><ruby>書<rt>か</rt></ruby>き<ruby>出<rt>だ</rt></ruby>し</div><div class="opening">${erb(d.title)}</div></div>`;
  h+=`<div class="panel"><div class="label">${erb(d.who)}の<ruby>事情<rt>じじょう</rt></ruby>カード</div><div class="card">${erb(card.text)}</div>`+
     flipped.map(i=>`<div class="label" style="margin-top:8px">めくったカード</div><div class="card plain">${erb(d.cards[i].text)}</div>`).join("")+`</div>`;
  h+=`<div class="panel"><div class="label">あなたのえらんだ<ruby>続<rt>つづ</rt></ruby>き</div><div class="mine">${erb(d.title+choice)}</div></div>`;
  h+=`<div class="panel"><div class="label">マシンの<ruby>答<rt>こた</rt></ruby>え</div>`+
     `<div class="ans"><span class="tg"><ruby>教<rt>おし</rt></ruby>える<ruby>前<rt>まえ</rt></ruby></span><span class="tx">${before!==null?erb(d.title+before):'<span class="none">（<ruby>教<rt>おし</rt></ruby>える<ruby>前<rt>まえ</rt></ruby>は、<ruby>答<rt>こた</rt></ruby>えを<ruby>出<rt>だ</rt></ruby>していません）</span>'}</span></div>`+
     `<div class="ans after"><span class="tg"><ruby>教<rt>おし</rt></ruby>えたあと</span><span class="tx">${erb(d.title+after)}</span></div>`+
     `<div class="same">${same?"マシンと<ruby>同<rt>おな</rt></ruby>じ<ruby>答<rt>こた</rt></ruby>えを<ruby>選<rt>えら</rt></ruby>びました":"マシンとはちがう<ruby>答<rt>こた</rt></ruby>えを<ruby>選<rt>えら</rt></ruby>びました"}</div></div>`;
  h+=`<div class="panel"><div class="label">マシンの<ruby>頭<rt>あたま</rt></ruby>の<ruby>中<rt>なか</rt></ruby>（<ruby>玉<rt>たま</rt></ruby>の<ruby>色<rt>いろ</rt></ruby>が、マシンの<ruby>答<rt>こた</rt></ruby>え）</div><div class="jars">`+
     jar('<ruby>教<rt>おし</rt></ruby>える<ruby>前<rt>まえ</rt></ruby>',B,false)+jar('<ruby>教<rt>おし</rt></ruby>えたあと',K,true)+`</div></div>`;
  h+=`<div class="panel"><div class="label">ネタ<ruby>明<rt>あ</rt></ruby>かし</div><ul class="explain">${TAKEAWAY.map(x=>`<li>${rb(x)}</li>`).join("")}</ul><div class="final">${rb(FINAL)}</div></div>`;
  if(typeof p.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(p.d)) h+=`<div class="foot"><ruby>遊<rt>あそ</rt></ruby>んだ<ruby>日<rt>ひ</rt></ruby>：${esc(p.d)}</div>`;
  h+=`<button class="save noprint" id="save">PDFでほぞん</button><div class="shint noprint"><ruby>押<rt>お</rt></ruby>したら「PDF」や「ファイルに<ruby>保存<rt>ほぞん</rt></ruby>」を<ruby>選<rt>えら</rt></ruby>んでね</div>`;
  document.getElementById("main").innerHTML=h;
  document.getElementById("save").onclick=()=>window.print();
}
render();
addEventListener("hashchange",render);
</script>
</body></html>
